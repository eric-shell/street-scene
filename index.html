<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#19181a" />
    <title>Street Scene · Midnight street racing in your browser</title>
    <meta name="description" content="Race tuner cars at night through a neon city that's new every day. Beat AI rivals in circuits, sprints and drift events, build your car in the garage, and chase your own ghost. Free in the browser on desktop and phone." />
    <link rel="canonical" href="https://street-scene.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen opens the game full screen, with no browser bars over the HUD. Its start_url tags those
         launches utm_source=homescreen for the dashboard. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Street Scene" />
    <!-- Link previews (iMessage, Slack, Discord, X, LinkedIn, Facebook). Crawlers don't run JS, so these must be static
         and absolute. street-scene-card.jpg is the race intro's opening drone shot (seed rain39, a rain night) under the nitrous warp, with start fireworks at 1200x630 with the title; a new image gets a new name, since previews cache by URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Street Scene" />
    <meta property="og:title" content="Street Scene · Midnight street racing club" />
    <meta property="og:description" content="Night races through a neon city that's new every day. Tune your car, beat AI rivals, chase your ghost. Free in the browser." />
    <meta property="og:url" content="https://street-scene.vercel.app/" />
    <meta property="og:image" content="https://street-scene.vercel.app/street-scene-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A drone view high over a rain-wet night street lined with crowds, looking back through the start gantry as fireworks burst overhead, the buildings streaking with nitrous, under the Street Scene title and tagline" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Street Scene · Midnight street racing club" />
    <meta name="twitter:description" content="Night races through a neon city that's new every day. Tune your car, beat AI rivals, chase your ghost. Free in the browser." />
    <meta name="twitter:image" content="https://street-scene.vercel.app/street-scene-card.jpg" />
    <meta name="twitter:image:alt" content="A drone view high over a rain-wet night street lined with crowds, looking back through the start gantry as fireworks burst overhead, the buildings streaking with nitrous, under the Street Scene title and tagline" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Street Scene",
        "url": "https://street-scene.vercel.app/",
        "image": "https://street-scene.vercel.app/street-scene-card.jpg",
        "description": "A browser street racer: night races through a seeded procedural neon city, AI rivals, a garage, replays and ghosts.",
        "genre": ["Racing", "Arcade"],
        "gamePlatform": ["Web browser", "Desktop", "Mobile"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": "SinglePlayer",
        "author": { "@type": "Person", "name": "Eric Shell" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wght@6..144,-10..0,100..1000&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <p style="margin: 0; padding: 40vh 16px 0; min-height: 100vh; box-sizing: border-box; text-align: center; font: 600 16px/1.5 system-ui, sans-serif; color: #fcfcfa; background: #19181a">Street Scene is a 3D racing game and needs JavaScript. Turn it on for this site and reload.</p>
    </noscript>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
